<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><link rel="manifest" href="manifest.webmanifest"><title>Midnight Bass</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#351019,#080808 65%);color:white;font-family:system-ui;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}main{max-width:520px;margin:auto;padding:22px 0}.top{display:flex;gap:12px;align-items:center;margin-bottom:24px}.logo{background:#e92340;border-radius:15px;padding:13px;font-weight:1000;font-size:20px}.brand{font-weight:900;letter-spacing:2px}.sub{font-size:11px;color:#aaa;letter-spacing:2px}.panel{background:#151515;border:1px solid #333;border-radius:25px;padding:20px}.art{width:min(75vw,290px);aspect-ratio:1;margin:0 auto 22px;border-radius:24px;background:radial-gradient(circle,#641526,#10090b 70%);display:grid;place-items:center;font-size:70px;font-weight:1000;text-shadow:4px 4px #e92340}.info{text-align:center}.info h2{font-size:19px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{color:#aaa;font-size:13px;margin:0}.seek{width:100%;accent-color:#ef233c;margin-top:22px}.times{display:flex;justify-content:space-between;color:#aaa;font-size:11px}.controls{display:flex;justify-content:center;align-items:center;gap:25px;margin:16px}.controls button{background:none;border:0;color:white;font-size:27px;padding:8px}.controls .play{background:#ef233c;border-radius:50%;width:65px;height:65px;color:white}.actions{display:flex;gap:10px}.actions button{flex:1;padding:14px;border-radius:13px;border:1px solid #555;background:#222;color:white;font-weight:700}.actions .add{background:#b80e28;border:0}.section{display:flex;justify-content:space-between;margin:22px 3px 10px;font-size:14px;font-weight:800}.muted{color:#999;font-weight:400;font-size:12px}.song,.empty{width:100%;padding:13px;border-radius:14px;background:#171717;border:1px solid #333;color:white;margin-bottom:8px;text-align:left;display:flex;gap:12px;align-items:center}.song.active{border-color:#e92340}.thumb{background:#351019;color:#ff5369;border-radius:10px;padding:12px}.songname{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}.empty{display:block;text-align:center;color:#aaa;line-height:1.6}footer{text-align:center;color:#666;font-size:11px;margin:20px}input[type=file]{display:none}
</style></head><body><main><header class="top"><div class="logo">MB</div><div><div class="brand">MIDNIGHT BASS</div><div class="sub">YOUR MUSIC. YOUR NIGHT.</div></div></header><section class="panel"><div class="art">MB</div><div class="info"><h2 id="title">No song selected</h2><p id="artist">Add music from your phone</p></div><input id="seek" class="seek" type="range" min="0" max="1000" value="0"><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div><div class="controls"><button id="prev">⏮</button><button class="play" id="play">▶</button><button id="next">⏭</button></div><div class="actions"><button class="add" id="add">＋ Add Music</button><button id="shuffle">⤨ Shuffle: Off</button></div><input id="files" type="file" accept="audio/*" multiple></section><div class="section">YOUR PLAYLIST <span class="muted" id="count">0 tracks</span></div><div id="list"><div class="empty">Your playlist is empty.<br>Tap <b>Add Music</b> to choose audio files on your phone.</div></div><footer>MIDNIGHT BASS · MADE FOR MUSIC LOVERS</footer></main><audio id="audio"></audio><script>
const $=x=>document.getElementById(x),a=$('audio');let songs=[],i=-1,sh=false;const time=n=>isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function draw(){$('count').textContent=songs.length+' tracks';$('list').innerHTML='';if(!songs.length){$('list').innerHTML='<div class="empty">Your playlist is empty.<br>Tap <b>Add Music</b> to choose audio files on your phone.</div>';return}songs.forEach((s,j)=>{let b=document.createElement('button');b.className='song'+(j===i?' active':'');b.innerHTML='<span class="thumb">♪</span><span class="songname"></span>';b.querySelector('.songname').textContent=s.name.replace(/\.[^.]+$/,'');b.onclick=()=>load(j,true);$('list').append(b)})}
function load(j,go){i=(j+songs.length)%songs.length;a.src=songs[i].url;$('title').textContent=songs[i].name.replace(/\.[^.]+$/,'');$('artist').textContent='MIDNIGHT BASS • LOCAL TRACK';draw();if(go)a.play().catch(()=>{});$('play').textContent=go?'Ⅱ':'▶'}
$('add').onclick=()=>$('files').click();$('files').onchange=e=>{[...e.target.files].forEach(f=>{if(f.type.startsWith('audio/'))songs.push({name:f.name,url:URL.createObjectURL(f)})});draw();if(i<0&&songs.length)load(0,false);e.target.value=''};
$('play').onclick=()=>{if(i<0){if(songs.length)load(0,true);else $('files').click()}else if(a.paused)a.play();else a.pause()};a.onplay=()=>$('play').textContent='Ⅱ';a.onpause=()=>$('play').textContent='▶';$('prev').onclick=()=>{if(songs.length)load(i-1,true)};$('next').onclick=()=>{if(songs.length)load(sh?Math.floor(Math.random()*songs.length):i+1,true)};$('shuffle').onclick=()=>{sh=!sh;$('shuffle').textContent='⤨ Shuffle: '+(sh?'On':'Off')};a.onended=()=>{if(songs.length)load(sh?Math.floor(Math.random()*songs.length):i+1,true)};a.ontimeupdate=()=>{$('cur').textContent=time(a.currentTime);$('dur').textContent=time(a.duration);if(isFinite(a.duration))$('seek').value=a.currentTime/a.duration*1000};$('seek').oninput=()=>{if(isFinite(a.duration))a.currentTime=$('seek').value/1000*a.duration};if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');
</script></body></html>
